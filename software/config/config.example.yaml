# ============================================================
# vivo-v5 - configuración principal
# ============================================================
# Esta es la ÚNICA configuración que necesitas tocar.
# Después de instalar, ejecuta:  ./run.sh setup
# para poner la IP del Raspberry Shake.

station:
  network: "AM"
  station: "RE626"
  location: "00"
  channels: ["EHZ", "ENE", "ENN", "ENZ"]
  fs: 100.0
  # Sensibilidades medidas para RE626:
  # EHZ geófono (m/s), EN* acelerómetro (m/s^2)
  sensitivities:
    EHZ: 399650000.0
    ENE: 384500.0
    ENN: 384500.0
    ENZ: 384500.0

# Estaciones limpias usadas para confirmar o vetar a las 70 minutos.
cluster:
  - {network: "AM", station: "R2A1F", location: "00"}
  - {network: "AM", station: "R53D1", location: "00"}

seedlink:
  # El Shake debe estar en la misma red. Si "rs.local" no funciona,
  # pon aquí su IP (por ejemplo 172.21.226.111) con ./run.sh setup.
  host: "rs.local"
  port: 18000
  timeout_s: 20

fdsn:
  base: "https://data.raspberryshake.org/fdsnws"
  # El certificado de Raspberry Shake está vencido. Se desactiva la
  # verificación SOLO para este host, nunca de forma global.
  verify_ssl: false
  timeout_s: 60
  retries: 4

tiempos:
  # Bloques NO solapados. Cada 30 s se pide un bloque de 30 s + 30 s
  # de margen para que el filtro y el STA/LTA estén estabilizados.
  bloque_s: 30
  margen_s: 30
  # La confirmación se hace 70 minutos después del onset.
  atraso_fdsn_s: 4200
  poll_confirm_s: 60
  max_attempts: 12
  max_wait_h: 8
  # Espera entre reintentos si FDSN aún no tiene datos.
  retry_backoff_s: [300, 900, 1800, 3600, 7200]

deteccion:
  highpass: 0.7
  notch: [29.79, 18.07, 42.24]
  notch_q: 30
  orden_hp: 2
  banda: [2.0, 20.0]
  orden_bp: 4
  sta_s: 1.0
  lta_s: 20.0
  umbrales:
    RE626: {on: 3.2, off: 1.4}
    R2A1F: {on: 2.8, off: 1.2}
    R53D1: {on: 3.5, off: 1.5}
  provisional_on: 3.5
  provisional_off: 1.5
  tol_onset_s: 5.0
  pad_solape_s: 2.0

phasenet:
  enabled: true
  # "compare": corre 3C real (ENZ/ENN/ENE) y EHZ triplicado,
  # guarda ambos resultados y usa el de mayor probabilidad.
  mode: "compare"
  threshold: 0.15
  half_window_s: 15.0
  model: "original"
  cache_dir: "vendor/models"
  # Estación limpia usada para el pick ML. R53D1 es la validada
  # en el benchmark M4.5. Si quieres correr ambas, pon las dos.
  compare_stations: ["R53D1"]

traces:
  pre_s: 10.0
  post_s: 20.0
  raw: true
  live_minutes: 5.0

paths:
  data_dir: "viewer/data"
  viewer_dir: "viewer"
  fixture_dir: "tests/fixtures"
  log_dir: "logs"

retention:
  trace_days: 30
  raw_trace_days: 7
  viewer_events: 1000
